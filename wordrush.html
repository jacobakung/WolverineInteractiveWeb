<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordRush - Wolverine Interactive LLC</title>
    <meta name="description" content="WordRush - An exciting word puzzle game that challenges your vocabulary and quick thinking skills.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo-container">
                    <img src="logo.png" alt="Wolverine Interactive LLC Logo" class="logo" id="logo">
                    <a href="index.html" class="company-name" style="text-decoration: none; color: var(--text-light);">Wolverine Interactive LLC</a>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="index.html#games">Games</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
                <button class="mobile-menu-toggle" id="mobileMenuToggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <section class="game-hero">
        <div class="container">
            <div class="game-hero-content">
                <img src="assets/ICON.png" alt="WordRush Icon" class="game-hero-icon">
                <div class="game-hero-info">
                    <h1 class="game-hero-title">WordRush</h1>
                    <p class="game-hero-description">An exciting word puzzle game that challenges your vocabulary and quick thinking skills.</p>
                    <div class="game-platforms">
                        <span class="platform-tag">iOS</span>
                        <span class="platform-tag">Android</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="game-preview-section">
        <div class="container">
            <h2 class="section-title">Gameplay Preview</h2>
            <div class="game-video-wrapper">
                <video class="game-video" controls playsinline>
                    <source src="assets/Classic Preview/Classic Preview.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Wolverine Interactive LLC. All rights reserved.</p>
            <p><a href="assets/documents/WordRush_PrivacyPolicy.pdf" target="_blank">Privacy Policy</a></p>
        </div>
    </footer>

    <script>
        // Mobile Menu Toggle
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const navLinks = document.querySelector('.nav-links');

        mobileMenuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
            });
        });

        // Logo Visibility
        const logo = document.getElementById('logo');
        const logoImg = new Image();
        logoImg.onload = function() {
            logo.classList.add('visible');
        };
        logoImg.onerror = function() {
            logo.classList.remove('visible');
        };
        logoImg.src = 'logo.png';
    </script>
</body>
</html>
